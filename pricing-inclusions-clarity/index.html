  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const salt = b64(P.salt), iv = b64(P.iv), ct = b64(P.ct);
  const err = document.getElementById('err'), go = document.getElementById('go'), pw = document.getElementById('pw');
  const show = html => { document.open(); document.write(html); document.close(); };
  async function keyFromPassword(p) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function unlock(key) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    const raw = await crypto.subtle.exportKey('raw', key);
    try { sessionStorage.setItem('proto-key:' + P.id, btoa(String.fromCharCode(...new Uint8Array(raw)))); } catch (e) {}
    show(new TextDecoder().decode(plain));
  }
  // same tab, already unlocked: skip the prompt
  (async () => {
    const cached = sessionStorage.getItem('proto-key:' + P.id);
    if (!cached) return;
    try { const key = await crypto.subtle.importKey('raw', b64(cached), 'AES-GCM', true, ['decrypt']); await unlock(key); }
    catch (e) { sessionStorage.removeItem('proto-key:' + P.id); }
  })();
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = 'Unlocking…';
    try { await unlock(await keyFromPassword(pw.value)); }
    catch (e) { err.textContent = 'That password didn’t work. Check with the owner of the link.'; go.disabled = false; go.textContent = 'View prototype'; pw.select(); }
  });
